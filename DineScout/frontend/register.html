<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DineScout - Register Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-glow: rgba(249, 115, 22, 0.25);
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.16);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 70%);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      color: var(--text-main);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .register-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 20px;
      color: #fb923c;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-title span.highlight {
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 34px 30px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .card p.card-desc {
      color: var(--text-muted);
      font-size: 13.5px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    select {
      background-color: #0f172a;
      cursor: pointer;
    }

    select option {
      background-color: #0f172a;
      color: #ffffff;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input::placeholder {
      color: #64748b;
    }

    button.btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(249, 115, 22, 0.4);
    }

    #msg {
      margin-top: 14px;
      color: #f87171;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
    }

    .link {
      margin-top: 20px;
      font-size: 13.5px;
      color: var(--text-muted);
      text-align: center;
    }

    .link a {
      color: #fb923c;
      text-decoration: none;
      font-weight: 600;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .otp-box {
      display: none;
      margin-top: 10px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="register-container">

  <div class="brand-header">
    <div class="brand-badge">
      <span>Join DineScout Network</span>
    </div>
    <h1 class="brand-title">
      <span>Dine<span class="highlight">Scout</span></span>
    </h1>
  </div>

  <div class="card">
    <h2>Create Account</h2>
    <p class="card-desc">Sign up as a diner or restaurant business owner</p>

    <!-- REGISTER FORM -->
    <div id="registerBox">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="off" />
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a strong password" />
      </div>

      <div class="input-group">
        <label for="role">Account Type</label>
        <select id="role">
          <option value="">Select Role</option>
          <option value="user">User / Diner</option>
          <option value="owner">Restaurant Owner</option>
          <option value="admin">Platform Administrator</option>
        </select>
      </div>

      <button class="btn-primary" onclick="register()">Create Account</button>
    </div>

    <!-- OTP VERIFY -->
    <div class="otp-box" id="otpBox">
      <div class="input-group">
        <label for="otp">Enter 6-Digit OTP</label>
        <input
          type="text"
          id="otp"
          placeholder="Enter OTP sent to email"
          maxlength="6"
        />
      </div>

      <button class="btn-primary" onclick="verifyOTP()">Verify & Complete</button>
    </div>

    <p id="msg"></p>

    <div class="link">
      Already have an account?
      <a href="login.html">Sign In</a>
    </div>
  </div>

</div>

<script>
let savedEmail = "";

async function register() {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const role = document.getElementById("role").value;

  const msg = document.getElementById("msg");
  msg.innerText = "";
  msg.style.color = "#f87171";

  if (!username || !email || !password || !role) {
    msg.innerText = "All fields required";
    return;
  }

  try {
    const endpoint = window.location.origin.startsWith("http")
      ? `${window.location.origin}/api/auth/register`
      : "http://localhost:5000/api/auth/register";

    const res = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        email,
        password,
        role
      })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.innerText = data.msg || "Registration failed";
      return;
    }

    msg.style.color = "#4ade80";
    msg.innerText = data.msg || "Account created! Redirecting to login...";
    savedEmail = email;

    if (data.autoVerified) {
      setTimeout(() => {
        window.location.href = "login.html";
      }, 1200);
    } else {
      document.getElementById("registerBox").style.display = "none";
      document.getElementById("otpBox").style.display = "block";
    }

  } catch (err) {
    console.error("REGISTER ERROR:", err);
    msg.innerText = "Cannot connect to server. Please verify backend is running on port 5000.";
  }
}

async function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!otp || otp.length !== 6) {
    msg.innerText = "Enter valid 6-digit OTP";
    return;
  }

  try {
    const endpoint = window.location.origin.startsWith("http")
      ? `${window.location.origin}/api/auth/verify`
      : "http://localhost:5000/api/auth/verify";

    const res = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: savedEmail,
        otp: otp
      })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.innerText = data.msg || "OTP failed";
      return;
    }

    msg.style.color = "#4ade80";
    msg.innerText = "Verified! Redirecting to login...";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1200);

  } catch (err) {
    console.error("OTP ERROR:", err);
    msg.innerText = "Verification failed";
  }
}
</script>

</body>
</html>
