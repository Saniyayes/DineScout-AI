<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DineScout - Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-glow: rgba(249, 115, 22, 0.25);
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.16);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 70%);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      color: var(--text-main);
    }

    /* Subtle Pattern Background Grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 26px;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 20px;
      color: #fb923c;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-title span.highlight {
      color: var(--primary);
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 36px 32px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .card p.card-desc {
      color: var(--text-muted);
      font-size: 13.5px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #64748b;
      transition: color 0.2s ease;
    }

    input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 14.5px;
      color: #ffffff;
      transition: all 0.2s ease;
      outline: none;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input:focus + svg,
    .input-wrapper:focus-within svg {
      color: var(--primary);
    }

    button.btn-login {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.btn-login:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(249, 115, 22, 0.4);
    }

    button.btn-login:active {
      transform: translateY(0);
    }

    #msg {
      margin-top: 16px;
      color: #f87171;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
    }

    .link {
      margin-top: 22px;
      font-size: 13.5px;
      color: var(--text-muted);
      text-align: center;
    }

    .link a {
      color: #fb923c;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .link a:hover {
      color: #fdba74;
      text-decoration: underline;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
      }
      .brand-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">
    
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-badge">
        <span>AI Food & Market Intelligence</span>
      </div>
      <h1 class="brand-title">
        <span>Dine<span class="highlight">Scout</span></span>
      </h1>
      <p class="brand-subtitle">Smart Restaurant Recommendations & Business Analysis System</p>
    </div>

    <!-- Login Card -->
    <div class="card">
      <h2>Account Login</h2>
      <p class="card-desc">Enter your credentials to access your account</p>

      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            placeholder="Enter your username"
            autocomplete="off"
          />
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            onkeydown="if(event.key === 'Enter') login()"
          />
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
      </div>

      <button class="btn-login" onclick="login()">
        <span>Sign In</span>
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </button>

      <p id="msg"></p>

      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
        <p style="font-size: 11.5px; color: #94a3b8; margin-bottom: 8px; font-weight: 600;">⚡ Quick Demo Login:</p>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button onclick="fillDemo('testuser2', '123456')" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #e2e8f0; font-size: 11.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer;">Diner (testuser2)</button>
          <button onclick="fillDemo('testowner', '123456')" style="background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.3); color: #fb923c; font-size: 11.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer;">Owner (testowner)</button>
          <button onclick="fillDemo('admin', 'admin123')" style="background: rgba(168,85,247,0.18); border: 1px solid rgba(168,85,247,0.4); color: #c084fc; font-size: 11.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600;">🛡️ Admin (admin)</button>
        </div>
      </div>

      <div class="link">
        New to DineScout? <a href="register.html">Create an Account</a>
      </div>
    </div>

  </div>

<script>
function fillDemo(user, pwd) {
  document.getElementById("username").value = user;
  document.getElementById("password").value = pwd;
  login();
}

async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";
  msg.style.color = "#f87171";

  if (!username || !password) {
    msg.innerText = "Please enter both username and password";
    return;
  }

  try {
    const endpoint = window.location.origin.startsWith("http")
      ? `${window.location.origin}/api/auth/login`
      : "http://localhost:5000/api/auth/login";

    const res = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: username,
        password: password
      })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.innerText = data.msg || "Login failed";
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", data.role);
    localStorage.setItem("username", data.username || username);
    localStorage.removeItem("manual_logout");

    msg.style.color = "#4ade80";
    msg.innerText = "Login successful! Redirecting...";

    setTimeout(() => {
      if (data.role === "admin") {
        window.location.href = "admin.html";
      } else if (data.role === "owner") {
        window.location.href = "owner-dashboard.html";
      } else {
        window.location.href = "index.html";
      }
    }, 600);

  } catch (err) {
    console.error("LOGIN ERROR:", err);
    msg.innerText = "Cannot connect to server. Please verify backend is running on port 5000.";
  }
}
</script>

</body>
</html>
